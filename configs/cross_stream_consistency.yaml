work_dir: ./work_dir/cross_stream_consistency/
phase: train
device: "0,1"
random_seed: 42
eval_interval: 1
save_interval: 1
log_interval: 50
evaluate_tool: python
load_checkpoints: /path/to/csc_checkpoint.pt

# ─ Data ───────────────────────────────────────────────────────────────────────
feeder: SkeletonFeeder
dataset: mslr_si
feeder_args:
  setting: si
  datatype: skeleton
  split: [25, 46, 67, 86]
  norm_point: [0, 25, 46, 67]
  used_part: ["body", "hand21", "mouth_8"]
  skeleton_pkl: /path/to/pose_data_isharah2000_hands_lips_body_phase2_SI.pkl

# ─ Model ──────────────────────────────────────────────────────────────────────
model: TwoStream_Cosign
model_args:
  visual_args:
    in_channels: 2
    split: [25, 46, 67, 86]
    temporal_kernel: 3
    hidden_size: 512
    modes: ["body", "hand21", "mouth_8"]
    level: "1"
    adaptive: True
    CR_args:
      clip_length: 25
      ratio: 0.2

  conv_type: K3-P2-K3-P2
  num_layers: 2
  norm_scale: 64

  use_csc: True
  use_tape: False
  use_mstcn: False
  use_hybrid_backend: False

  loss_weights:
    CR_SeqCTC_static: 1.0
    CR_SeqCTC_motion: 1.0
    CR_ConvCTC_fusion: 1.0
    CR_SeqCTC_fusion: 1.0
    CR_GatedCTC_fusion: 0.8
    CR_Conv_fusion: 1.0
    CR_Seq_fusion: 1.0

# ─ Optimiser ──────────────────────────────────────────────────────────────────
batch_size: 8
test_batch_size: 8
optimizer_args:
  base_lr: 0.0002
  optimizer: AdamW
  learning_ratio: 1
  scheduler: cosine
  num_epoch: 51
  warmup_epochs: 1
  label_smoothing: 0.1
  weight_decay: 0.0005

num_epoch: 51
eval_max_batches: ~
train_max_batches: ~
