work_dir: ./work_dir/train_run/
phase: train
device: "0,1"
save_interval: 1
random_seed: 42
eval_interval: 1
eval_start_epoch: 15
log_interval: 50
evaluate_tool: python
test_trigger: 15.0

feeder: SkeletonFeeder
dataset: mslr_iccv_si
dataset_part: all
num_worker: 4

feeder_args:
  setting: si
  datatype: skeleton
  split: [25, 46, 67, 86]
  norm_point: [0, 25, 46, 67]
  used_part: ["body", "hand21", "mouth_8"]
  skeleton_pkl: /kaggle/input/mslr-task1/pose_data_isharah2000_hands_lips_body_phase2_SI.pkl

train_args:
  clip_grad: 5.0
  max_batches: ~

model: TwoStream_Cosign
model_args:
  visual_args:
    in_channels: 2
    split: [25, 46, 67, 86]
    temporal_kernel: 3
    hidden_size: 512
    modes: ["body", "hand21", "mouth_8"]
    level: "1"
    adaptive: true
    CR_args:
      clip_length: 25
      ratio: 0.2

  conv_type: K3-P2-K3-P2
  num_layers: 2

  use_tape: false
  use_mstcn: false
  use_hybrid_backend: false
  use_ssd: false
  use_csc: false

  loss_weights:
    CR_ConvCTC_fusion: 1.0
    CR_ConvCTC_motion: 1.0
    CR_ConvCTC_static: 1.0
    CR_Conv_fusion: 2.0
    CR_Conv_motion: 2.0
    CR_Conv_static: 2.0
    CR_SeqCTC_fusion: 1.0
    CR_SeqCTC_motion: 1.0
    CR_SeqCTC_static: 1.0
    CR_Seq_fusion: 2.0
    CR_Seq_motion: 2.0
    CR_Seq_static: 2.0

  norm_scale: 64

batch_size: 8
test_batch_size: 8

optimizer_args:
  base_lr: 0.0002
  label_smoothing: 0.1
  learning_ratio: 1
  nesterov: false
  optimizer: AdamW
  scheduler: cosine
  start_epoch: 0
  warmup_epochs: 1
  weight_decay: 0.0005
  num_epoch: 52

load_checkpoints: null
load_weights: null
freeze_layers: []
ignore_weights: []
reset_optimizer: false
